name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read

jobs:
  security:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify linked issue
        if: github.event_name == 'pull_request'
        run: node scripts/check-linked-issue.mjs
      - name: Scan candidate for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/secrets.json"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
  tests:
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Prepare supported Git for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = 'C:\Program Files\Git'
          $uninstaller = Join-Path $gitRoot 'unins000.exe'
          Write-Host "Runner Git discovery:"
          Get-Command git -All | Select-Object Source, Version | Format-Table -AutoSize
          if (Test-Path -LiteralPath $gitRoot) {
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "Git installation exists without its expected uninstaller: $gitRoot" }
            Write-Host "Removing runner image Git before installing the pinned test version: $(& (Join-Path $gitRoot 'cmd\git.exe') --version)"
            $remove = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
            if ($remove.ExitCode -ne 0) { throw "Runner image Git uninstaller failed: $($remove.ExitCode)" }
            if (Test-Path -LiteralPath (Join-Path $gitRoot 'cmd\git.exe')) { throw 'Runner image Git remained after uninstall' }
          }
          $installer = Join-Path $env:RUNNER_TEMP 'Git-2.54.0-64-bit.exe'
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.54.0.windows.1/Git-2.54.0-64-bit.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '2b96e7854f0520f0f6b709c21041d9801b1be44d5e1a0d9fa621b2fbc40f1983') { throw 'Git installer checksum mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR="C:\Program Files\Git"' -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Git installer failed: $($install.ExitCode)" }
          $pinnedGit = Join-Path $gitRoot 'cmd\git.exe'
          Write-Host "Installed pinned Git: $(& $pinnedGit --version)"
          if ((& $pinnedGit --version) -ne 'git version 2.54.0.windows.1') { throw 'Unexpected Git version' }
          'C:\Program Files\Git\cmd' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Diagnose Windows Git trust probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = @'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import os from "node:os";
          import { spawnSync as nativeSpawnSync } from "node:child_process";
          import { createGitSession } from "./scripts/lib/git-trust-source.mjs";
          import { windowsHostPath } from "./tdd-orchestrator/lib/fs-transaction/index.mjs";

          const tracedSpawnSync = (file, args, options) => {
            const started = Date.now();
            const result = nativeSpawnSync(file, args, options);
            if (/\\powershell\.exe$/i.test(file)) {
              const stderr = String(result?.stderr ?? "").replace(/[\r\n\t]+/g, " ").slice(0, 1024);
              console.error(JSON.stringify({
                event: "git-trust-native-query",
                status: result?.status ?? null,
                errorCode: result?.error?.code ?? null,
                signal: result?.signal ?? null,
                elapsedMs: Date.now() - started,
                stderr,
              }));
            }
            return result;
          };
          const session = createGitSession({ fs, path, crypto, os, spawnSync: tracedSpawnSync, platform: process.platform, env: process.env, windowsHostPath });
          const result = session.run(["config", "--local", "--null", "--get-all", "core.hooksPath"], { cwd: process.cwd() });
          if (result?.error) {
            console.error(JSON.stringify({ event: "git-trust-admission", code: result.error.code, reason: result.error.reason, message: result.error.message }));
            process.exitCode = 1;
          } else {
            console.log(JSON.stringify({ event: "git-trust-admission", status: result?.status ?? null }));
          }
          '@
          $source | node --input-type=module
      - run: npm ci
      - run: npm test
  # Keep the existing required check name as the aggregate gate. It must not
  # turn green while either platform suite is pending, failed or skipped.
  quality:
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)) }}
    needs: [security, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require security and both platform suites
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        shell: bash
        run: |
          test "$SECURITY_RESULT" = success
          test "$TESTS_RESULT" = success
