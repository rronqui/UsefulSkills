name: release-please
# O runtime da Action é independente do Node usado pela suíte do projeto.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    steps:
      # PAT pessoal: PRs criados com GITHUB_TOKEN não disparam outros
      # workflows (CI ficaria sem rodar no PR de release). Ver README.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
